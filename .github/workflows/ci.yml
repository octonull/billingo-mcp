name: Lint, Test & Build (Checks)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify generated types are up to date with the vendored spec
        run: |
          npm run gen:types
          git diff --exit-code src/billingo/types.gen.ts \
            || { echo "::error::types.gen.ts is stale. Run 'npm run gen:types' and commit the result."; exit 1; }

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        if: matrix.node == 22
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Installs the packed tarball and runs it through npm's `bin` symlink, exactly as
      # `npx` and `npm i -g` do. Running dist/ directly is not enough: the symlink is
      # what broke 0.1.3 (issue #31), and a direct run never goes through it.
      - name: Smoke-test the installed bin (via npm's symlink)
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP"/billingo-billingo-mcp-*.tgz
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | BILLINGO_API_KEY=dummy "$RUNNER_TEMP/global/bin/billingo-mcp" \
            | grep -q "\"serverInfo\":{\"name\":\"billingo\",\"version\":\"$(node -p 'require("./package.json").version')\"}" \
            || { echo "::error::installed billingo-mcp bin did not answer initialize with the package version"; exit 1; }

      # Packs the Claude Desktop Extension and runs the server out of the unpacked bundle,
      # the way Claude Desktop does: only the files inside the .mcpb, its own node_modules.
      - name: Pack the .mcpb and smoke-test the unpacked server
        run: |
          npm run pack:mcpb
          VERSION=$(node -p "require('./package.json').version")
          unzip -q "build/mcpb/billingo-mcp-${VERSION}.mcpb" -d "$RUNNER_TEMP/mcpb"
          test "$(node -p "require(process.argv[1]).version" "$RUNNER_TEMP/mcpb/manifest.json")" = "$VERSION" \
            || { echo "::error::the .mcpb manifest does not carry the package.json version"; exit 1; }
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | BILLINGO_API_KEY=dummy BILLINGO_ALLOW_WRITE=false BILLINGO_TOOL_CATEGORIES= \
              node "$RUNNER_TEMP/mcpb/server/dist/bin/stdio.js" > "$RUNNER_TEMP/mcpb.jsonl"
          grep -q "\"serverInfo\":{\"name\":\"billingo\",\"version\":\"$VERSION\"}" "$RUNNER_TEMP/mcpb.jsonl" \
            || { echo "::error::the unpacked .mcpb server did not answer initialize with the package version"; exit 1; }
          TOOLS=$(grep '"id":2' "$RUNNER_TEMP/mcpb.jsonl" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).result.tools.length")
          test "$TOOLS" = 24 \
            || { echo "::error::expected 24 read-only tools from the unpacked .mcpb server, got $TOOLS"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: billingo-mcp:ci
      - name: Verify the container answers a health check
        run: |
          docker run --rm -d -p 3000:3000 --name ci-test billingo-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"ok"'
          docker rm -f ci-test
