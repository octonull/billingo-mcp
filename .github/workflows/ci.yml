name: Lint, Test & Build (Checks)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify generated types are up to date with the vendored spec
        run: |
          npm run gen:types
          git diff --exit-code src/billingo/types.gen.ts \
            || { echo "::error::types.gen.ts is stale. Run 'npm run gen:types' and commit the result."; exit 1; }

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke-test the stdio binary
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | BILLINGO_API_KEY=dummy node dist/transports/stdio.js \
            | grep -q '"serverInfo"' \
            || { echo "::error::stdio binary did not answer initialize"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: billingo-mcp:ci
      - name: Verify the container answers a health check
        run: |
          docker run --rm -d -p 3000:3000 --name ci-test billingo-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"ok"'
          docker rm -f ci-test
