name: Live smoke

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Never runs on fork PRs: the sandbox key must not be exposed to untrusted code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          BILLINGO_SANDBOX_API_KEY: ${{ secrets.BILLINGO_SANDBOX_API_KEY }}
