name: Release Publish NPM and ghcr.io

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Tag the current package.json version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT=$(git rev-list -n 1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$EXISTING_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::Tag $TAG already exists but points at a different commit ($EXISTING_COMMIT, not $HEAD_COMMIT) — this version may already have been released from a different state."
              exit 1
            fi
            echo "Tag $TAG already exists and points at the current commit — probably a retry after a failed publish. Skipping tag creation."
          else
            git tag "$TAG"
            # Tags aren't covered by the master branch ruleset (only branch pushes are),
            # so this push doesn't need the bypass that a direct commit push would.
            git push origin "$TAG"
          fi

      # Temporary: publishes with an npm Automation token (NPM_TOKEN) so the very first
      # publish can create the @billingo/billingo-mcp package. Once it exists, configure
      # a Trusted Publisher for this workflow on npmjs.com (package Settings > Trusted
      # publishing), then delete the NPM_TOKEN secret and drop the `env:` block below —
      # npm's OIDC-based trusted publishing needs no stored token at all.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    needs: publish
    uses: ./.github/workflows/publish-docker.yml
    with:
      commit_sha: ${{ github.sha }}
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit
