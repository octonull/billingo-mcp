name: Release Publish NPM and ghcr.io

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm CLI >=11.5.1; the version bundled with a
      # given Node 22 build can lag behind that.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Tag the current package.json version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT=$(git rev-list -n 1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$EXISTING_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::Tag $TAG already exists but points at a different commit ($EXISTING_COMMIT, not $HEAD_COMMIT) — this version may already have been released from a different state."
              exit 1
            fi
            echo "Tag $TAG already exists and points at the current commit — probably a retry after a failed publish. Skipping tag creation."
          else
            git tag "$TAG"
            # Tags aren't covered by the master branch ruleset (only branch pushes are),
            # so this push doesn't need the bypass that a direct commit push would.
            git push origin "$TAG"
          fi

      # Trusted Publisher configured on npmjs.com (package Settings > Trusted publishing:
      # GitHub Actions, octonull/billingo-mcp, publish-release.yml) — npm exchanges this
      # job's OIDC token for a short-lived publish credential automatically. No stored
      # NPM_TOKEN needed; id-token: write above is what makes the OIDC token available.
      - name: Publish to npm
        run: npm publish --provenance --access public

      # Syncs the just-published version's CHANGELOG.md entry to a GitHub Release.
      # With no version argument this defaults to the latest entry in CHANGELOG.md,
      # i.e. exactly the version this run just tagged and published.
      - name: Create GitHub Release
        run: npx changelogen gh release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    needs: publish
    uses: ./.github/workflows/publish-docker.yml
    with:
      commit_sha: ${{ github.sha }}
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: deploy
    permissions: {}
    env:
      HAS_APP_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY != '' }}
      COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
      VERSION: ${{ needs.publish.outputs.version }}
      DEPLOY_REPO: ${{ github.repository_owner }}/${{ secrets.DEPLOY_REPO }}
    steps:
      - name: Skip without the deploy app
        if: env.HAS_APP_KEY != 'true'
        run: |
          echo "::warning::The deploy app is not configured in the deploy environment, so $VERSION was not deployed. Start the deploy by hand with commit_sha=$COMMIT_SHA."

      - name: Create deploy app token
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.DEPLOY_REPO }}
          permission-actions: write

      - name: Start the deploy
        if: env.HAS_APP_KEY == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run deploy-to-ecs.yml --repo "$DEPLOY_REPO" --ref master -f commit_sha="$COMMIT_SHA"
          echo "Started the $VERSION deploy ($COMMIT_SHA)." >> "$GITHUB_STEP_SUMMARY"
